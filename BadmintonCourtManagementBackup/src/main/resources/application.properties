spring.application.name=badminton-backup
server.port=${BACKUP_SERVER_PORT:9091}

spring.datasource.url=${BACKUP_META_URL:jdbc:mysql://localhost:3306/backup_meta?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${BACKUP_META_USERNAME:backup_meta_user}
spring.datasource.password=${BACKUP_META_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

backup.source.url=${BCM_BACKUP_SOURCE_URL:jdbc:mysql://localhost:3306/badminton-db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
backup.source.username=${BCM_BACKUP_SOURCE_USERNAME:badminton_backup_reader}
backup.source.password=${BCM_BACKUP_SOURCE_PASSWORD:}
backup.source.schema=${BCM_BACKUP_SOURCE_SCHEMA:badminton-db}
backup.storage.base-path=${BACKUP_PATH:./backups}
backup.schedule.zone=${BACKUP_SCHEDULE_ZONE:Asia/Ho_Chi_Minh}
backup.schedule.daily-cron=${BACKUP_DAILY_CRON:0 0 0 * * *}
backup.schedule.weekly-cron=${BACKUP_WEEKLY_CRON:0 15 0 * * MON}
backup.schedule.monthly-cron=${BACKUP_MONTHLY_CRON:0 30 0 1 * *}
backup.rabbitmq.enabled=${BACKUP_RABBITMQ_ENABLED:true}
backup.rabbitmq.exchange=${BACKUP_EXCHANGE:badminton.backup.exchange}
backup.rabbitmq.trigger-queue=${BACKUP_TRIGGER_QUEUE:badminton.backup.trigger.queue}
backup.rabbitmq.trigger-routing-key=${BACKUP_TRIGGER_ROUTING_KEY:badminton.backup.trigger}
backup.rabbitmq.completed-routing-key=${BACKUP_COMPLETED_ROUTING_KEY:badminton.backup.status.completed}
backup.rabbitmq.failed-routing-key=${BACKUP_FAILED_ROUTING_KEY:badminton.backup.status.failed}
backup.security.public-key-location=${BCM_JWT_PUBLIC_KEY:file:../BadmintonCourtManagement/src/main/resources/keys/public_key.pem}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
