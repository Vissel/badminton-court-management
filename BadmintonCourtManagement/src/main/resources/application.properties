spring.profiles.active=@activeProfile@
#spring.profiles.default=dev
# application.properties
server.servlet.session.timeout=1m
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
# application.properties
#logging.level.org.apache.tomcat=INFO
#logging.level.org.apache.catalina=INFO
# DEBUG logging moved to application-dev.properties (can leak request params/credentials)
#spring.devtools.add-properties=false
currency=VND
#30 minutes
session.timeout=1800000
jwt.access-token-ttl=PT30M
jwt.refresh-token-ttl=PT12H
jwt.private-key-location=classpath:keys/private_key.pem
jwt.public-key-location=classpath:keys/public_key.pem
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080
liquibase.secureParsing=false
logging.level.liquibase=WARN
# product import (.xlsx) upload cap
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── MISA meInvoice e-invoice integration ──
# Credentials live here (never in the DB or API responses). Leave blank to
# disable; the FE toggle is bill_config.einvoice_enabled.
einvoice.misa.base-url=https://api.meinvoice.vn
einvoice.misa.app-id=
einvoice.misa.tax-code=
einvoice.misa.username=
einvoice.misa.password=
einvoice.misa.timeout-seconds=15
# API paths — environments differ, so keep them overridable per profile.
einvoice.misa.token-path=/api/integration/token
einvoice.misa.publish-path=/api/integration/invoice
einvoice.misa.status-path=/api/integration/invoice/status
einvoice.misa.download-path=/api/integration/invoice/download
einvoice.misa.send-mail-path=/api/integration/invoice/send-mail