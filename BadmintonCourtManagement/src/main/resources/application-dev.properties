server.servlet.context-path=/bad-court-management-dev
server.port=9080
#30 minutes
session.timeout=1800000
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/badminton-online-feat?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC%2B7
spring.datasource.username=badminton-user03
spring.datasource.password=badmintonuser03
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.devtools.restart.enabled=false
# Verbose logging for local debugging only ? never enable in prod (can log request params)
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG